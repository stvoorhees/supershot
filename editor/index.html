<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supershot</title>
<style>
  /* Supershot editor — offline, self-contained. Premium, macOS-flavored dark UI.
     The WPF shell injects the capture via window.chrome.webview; standalone: drop/paste. */
  :root{
    --bg:#1d1d20; --stage:#161618; --panel:#232327; --panel-2:#2a2a30;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --ink:#f2f3f5; --ink-2:#a0a2ab; --ink-3:#6d707a;
    --accent:#0a84ff; --accent-hi:#409cff;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:-.012em;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
  ::selection{background:rgba(10,132,255,.3)}

  .titlebar{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px 0 15px;border-bottom:1px solid var(--line);background:var(--bg)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
  .logo{width:18px;height:18px;border-radius:5px;object-fit:contain;display:block}
  .brand .sub{color:var(--ink-3);font-weight:500}
  .tb-spacer{flex:1}
  .icon-btn{width:30px;height:28px;border:0;background:transparent;color:var(--ink-2);border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:.12s}
  .icon-btn:hover{background:var(--panel-2);color:var(--ink)}
  .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .wc{display:flex;gap:3px;margin-left:4px}
  .wc button{width:32px;height:26px;border:0;background:transparent;color:var(--ink-2);border-radius:7px;cursor:pointer;font-size:13px;font-family:var(--sans);transition:.12s}
  .wc button:hover{background:var(--panel-2);color:var(--ink)}
  .wc button[data-w=close]:hover{background:#e5484d;color:#fff}

  .app{height:calc(100% - 46px);display:grid;grid-template-columns:1fr 300px}

  .stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--stage);padding:74px 40px 28px}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 30%, rgba(255,255,255,.03), transparent 70%)}
  .canvas-wrap{position:relative;display:flex;filter:drop-shadow(0 24px 50px rgba(0,0,0,.45))}
  canvas{border-radius:4px;display:block}
  #c.tool{cursor:crosshair}

  .toolbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:3px;padding:5px;border-radius:14px;
    background:rgba(36,36,42,.72);border:1px solid var(--line-2);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .tool-btn{width:34px;height:34px;border:0;background:transparent;color:var(--ink-2);border-radius:9px;cursor:pointer;display:grid;place-items:center;transition:.12s}
  .tool-btn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .tool-btn.on{background:var(--accent);color:#fff}
  .tool-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tb-sep{width:1px;height:22px;background:var(--line-2);margin:0 3px}
  .swatch-mini{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.4);cursor:pointer}

  .zoombar{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:1px;padding:4px;border-radius:11px;
    background:rgba(36,36,42,.72);border:1px solid var(--line-2);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .zoombar button{border:0;background:transparent;color:var(--ink-2);width:28px;height:26px;border-radius:7px;cursor:pointer;font-size:15px;font-family:var(--sans)}
  .zoombar button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .zoombar #zoomVal{min-width:44px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:default}
  .zoombar #zoomFit{width:auto;padding:0 9px;font-size:12px;font-weight:500}
  .stage.empty .zoombar{display:none}

  .drop-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-2);font-size:14px}
  .stage.empty .canvas-wrap,.stage.empty .toolbar{display:none}
  .stage.empty .drop-hint{display:flex}
  .drop-hint .big{font-size:19px;color:var(--ink);font-weight:600}
  .drop-hint kbd{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
  #textInput{position:absolute;display:none;z-index:10;background:transparent;border:1px dashed var(--accent);color:#fff;font-family:var(--sans);font-weight:600;outline:none;padding:2px 4px;min-width:40px}

  .panel{border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;padding:4px 0 92px}
  .panel::-webkit-scrollbar{width:9px}.panel::-webkit-scrollbar-thumb{background:#33343b;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  .group{padding:17px 18px;border-bottom:1px solid var(--line)}
  .glabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:13px}

  .seg{display:flex;background:#161618;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 2px;border-radius:6px;cursor:pointer;transition:.12s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}

  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:13px}
  .sw{aspect-ratio:1;border-radius:9px;cursor:pointer;border:1px solid var(--line);transition:transform .12s,box-shadow .15s}
  .sw:hover{transform:translateY(-2px)}
  .sw.on{box-shadow:0 0 0 2px var(--accent),0 0 0 4px rgba(10,132,255,.22)}
  .pickbtn{width:100%;margin-top:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:500;padding:9px 0;border-radius:9px;cursor:pointer}
  .pickbtn:hover{background:var(--panel-2)}

  .row{display:flex;align-items:center;justify-content:space-between;margin:15px 0 8px}
  .row label{font-size:13px;color:var(--ink-2);font-weight:450}
  .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:38px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:#33343b;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .1s}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.12)}
  input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;border:1px solid var(--line);border-radius:9px;cursor:pointer;padding:3px}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}

  .actions{position:absolute;bottom:0;right:0;width:300px;display:flex;gap:10px;padding:15px 18px;background:var(--bg);border-top:1px solid var(--line)}
  .btn{flex:1;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:13px;padding:11px 0;border-radius:10px;cursor:pointer;transition:.14s}
  .btn:hover{background:var(--panel-2)}
  .btn.primary{border:0;color:#fff;background:var(--accent)}
  .btn.primary:hover{background:var(--accent-hi)}
  .hidden-file{display:none}

  /* settings popover */
  .pop{position:absolute;top:44px;right:12px;width:300px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);padding:16px;z-index:30;display:none}
  .pop.open{display:block}
  .pop h3{font-size:13px;font-weight:650;margin-bottom:14px}
  .pop .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
  .pop label{font-size:13px;color:var(--ink-2)}
  .pop select,.pop .path{font-family:var(--sans);font-size:12.5px;background:#161618;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px}
  .pop .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)}
  .switch{width:40px;height:24px;border-radius:999px;background:#3a3b42;position:relative;cursor:pointer;transition:.15s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--accent)}.switch.on::after{left:18px}
  .pop small{color:var(--ink-3);font-size:11.5px;display:block;margin-top:4px}
</style>
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="brand"><img class="logo" src="logo.png" alt="" />Supershot <span class="sub">· editor</span></div>
    <div class="tb-spacer"></div>
    <button class="icon-btn" id="gearBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div class="wc" id="wc"><button data-w="min" title="Minimize">&#x2013;</button><button data-w="close" title="Close">&#x2715;</button></div>
  </div>

  <div class="pop" id="settings">
    <h3>Settings</h3>
    <div class="set-row"><label>Auto-copy on capture</label><div class="switch" id="autoCopy"></div></div>
    <div class="set-row"><label>Capture hotkey</label>
      <select id="hotkeySel">
        <option value="ctrl+shift+2">Ctrl+Shift+2</option>
        <option value="ctrl+shift+3">Ctrl+Shift+3</option>
        <option value="ctrl+shift+4">Ctrl+Shift+4</option>
        <option value="ctrl+shift+s">Ctrl+Shift+S</option>
        <option value="printscreen">PrintScreen</option>
      </select>
    </div>
    <div class="set-row"><label>Save to folder</label></div>
    <div class="set-row" style="margin-top:-6px"><span class="path" id="folderPath">Ask every time</span><button class="pickbtn" style="width:auto;margin:0;padding:6px 10px" id="chooseFolder">Choose…</button></div>
    <small id="hostOnly">Hotkey and save-folder apply in the desktop app.</small>
  </div>

  <div class="app">
    <div class="stage empty" id="stage">
      <div class="toolbar" id="toolbar"></div>
      <div class="canvas-wrap"><canvas id="c"></canvas></div>
      <div class="zoombar" id="zoombar">
        <button id="zoomOut" title="Zoom out">&#x2212;</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomFit" title="Fit to window">Fit</button>
      </div>
      <input id="textInput" />
      <div class="drop-hint">
        <div class="big">Drop or paste a screenshot</div>
        <div>or press <kbd>⌘/Ctrl</kbd> + <kbd>V</kbd> · <span id="sampleLink" style="color:var(--accent);cursor:pointer">load a sample</span></div>
      </div>
    </div>

    <aside class="panel">
      <div class="group">
        <div class="glabel">Background</div>
        <div class="seg" id="bgtype">
          <button data-t="gradient" class="on">Gradient</button>
          <button data-t="solid">Solid</button>
          <button data-t="image">Image</button>
          <button data-t="none">None</button>
        </div>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="solid" value="#1f2430" style="display:none;margin-top:13px" />
        <button class="pickbtn" id="bgImageBtn" style="display:none">Choose image…</button>
      </div>

      <div class="group">
        <div class="glabel">Frame</div>
        <div class="seg" id="frametype" style="margin-bottom:14px">
          <button data-f="none" class="on">None</button>
          <button data-f="mac">macOS</button>
          <button data-f="windows">Windows</button>
        </div>
        <div class="row"><label>Padding</label><span class="val" id="padV">64</span></div>
        <input type="range" id="pad" min="0" max="240" value="64" />
        <div class="row"><label>Corner radius</label><span class="val" id="radV">14</span></div>
        <input type="range" id="rad" min="0" max="48" value="14" />
        <div class="row"><label>Shadow</label><span class="val" id="shV">45</span></div>
        <input type="range" id="sh" min="0" max="100" value="45" />
      </div>

      <div class="group" id="markGroup" style="display:none">
        <div class="glabel">Markup</div>
        <div class="row"><label>Thickness</label><span class="val" id="wV">4</span></div>
        <input type="range" id="strokeW" min="1" max="16" value="4" />
        <div class="row" style="margin-bottom:0"><label>Color</label></div>
        <input type="color" id="markColor" value="#ff453a" style="margin-top:8px" />
      </div>

      <div class="actions">
        <button class="btn" id="openBtn">Open</button>
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </aside>
  </div>
  <input type="file" id="file" class="hidden-file" accept="image/*" />
  <input type="file" id="bgFile" class="hidden-file" accept="image/*" />

<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');
const stage = $('stage');

const GRADIENTS = [
  {a:'#f6d365',b:'#fda085'}, {a:'#a1c4fd',b:'#c2e9fb'}, {a:'#7b6cff',b:'#8ee3f5'}, {a:'#ff9a9e',b:'#fad0c4'},
  {a:'#30cfd0',b:'#330867'}, {a:'#0f2027',b:'#2c5364'}, {a:'#e0c3fc',b:'#8ec5fc'}, {a:'#f093fb',b:'#f5576c'},
  {a:'#4facfe',b:'#00f2fe'}, {a:'#161a24',b:'#2b2f3a'}, {a:'#fbc2eb',b:'#a6c1ee'}, {a:'#84fab0',b:'#8fd3f4'},
  {a:'#d299c2',b:'#fef9d7'}, {a:'#ffecd2',b:'#fcb69f'}, {a:'#c1dfc4',b:'#deecdd'},
];
const ANG=135*Math.PI/180;
const state = { bgType:'gradient', grad:2, solid:'#1f2430', pad:64, rad:14, shadow:45,
                frame:'none', tool:'select', color:'#ff453a', width:4 };
let img=null, bgImg=null;
let annots=[], current=null, selected=null, dragMode=null, dragStart=null, dragOrig=null, guides=[];
let resizeH=null, spacingMarks=[];
let zoom=1, panX=0, panY=0, panMode=false, panStart=null;
let undoStack=[], redoStack=[];
const settings = { autoCopy:false, hotkey:'ctrl+shift+2', saveFolder:'' };

/* ---------- persistence ---------- */
function saveSettings(){ try{ localStorage.setItem('supershot.state', JSON.stringify({
  bgType:state.bgType,grad:state.grad,solid:state.solid,pad:state.pad,rad:state.rad,shadow:state.shadow,frame:state.frame,color:state.color,width:state.width,
  autoCopy:settings.autoCopy})); }catch(e){} }
function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem('supershot.state')||'{}');
  Object.assign(state,{bgType:s.bgType??state.bgType,grad:s.grad??state.grad,solid:s.solid??state.solid,pad:s.pad??state.pad,rad:s.rad??state.rad,shadow:s.shadow??state.shadow,frame:s.frame??state.frame,color:s.color??state.color,width:s.width??state.width});
  if(s.autoCopy!=null) settings.autoCopy=s.autoCopy;
}catch(e){} }

/* ---------- swatches ---------- */
const swWrap=$('swatches');
GRADIENTS.forEach((g,i)=>{ const d=document.createElement('div'); d.className='sw'; d.dataset.i=i;
  d.style.background=`linear-gradient(135deg, ${g.a}, ${g.b})`;
  d.onclick=()=>{ state.grad=i; state.bgType='gradient'; syncBgType(); render(); saveSettings(); }; swWrap.appendChild(d); });
function syncSwatch(){ [...swWrap.children].forEach(d=>d.classList.toggle('on', +d.dataset.i===state.grad)); }
function syncBgType(){
  [...$('bgtype').children].forEach(b=>b.classList.toggle('on', b.dataset.t===state.bgType));
  swWrap.style.display=state.bgType==='gradient'?'grid':'none';
  $('solid').style.display=state.bgType==='solid'?'block':'none';
  $('bgImageBtn').style.display=state.bgType==='image'?'block':'none';
  syncSwatch();
}
$('bgtype').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; state.bgType=b.dataset.t; syncBgType(); render(); saveSettings();
  if(b.dataset.t==='image'&&!bgImg) $('bgFile').click(); };
$('solid').oninput=e=>{ state.solid=e.target.value; render(); saveSettings(); };
$('bgImageBtn').onclick=()=>$('bgFile').click();
$('bgFile').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=ev=>{ const i=new Image(); i.onload=()=>{ bgImg=i; state.bgType='image'; syncBgType(); render(); }; i.src=ev.target.result; }; rd.readAsDataURL(f); };

/* ---------- frame + sliders ---------- */
$('frametype').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; state.frame=b.dataset.f;
  [...$('frametype').children].forEach(x=>x.classList.toggle('on',x===b)); render(); saveSettings(); };
function fillTrack(el){ const p=(el.value-el.min)/(el.max-el.min)*100; el.style.background=`linear-gradient(90deg, var(--accent) ${p}%, #33343b ${p}%)`; }
function slider(id,key,label,persist){ const el=$(id); el.oninput=()=>{ state[key]=+el.value; if(label)$(label).textContent=el.value; fillTrack(el); render(); if(persist)saveSettings(); }; }
slider('pad','pad','padV',1); slider('rad','rad','radV',1); slider('sh','shadow','shV',1); slider('strokeW','width','wV',1);
$('markColor').oninput=e=>{ state.color=e.target.value; syncMini(); if(selected){ pushUndo(); selected.color=e.target.value; render(); } saveSettings(); };

/* ---------- toolbar ---------- */
const ICONS={
  select:'<path d="M5 3l6 15 2-6 6-2z"/>', arrow:'<path d="M5 19L19 5"/><path d="M10 5h9v9"/>',
  box:'<rect x="4" y="5" width="16" height="14" rx="2"/>', ellipse:'<ellipse cx="12" cy="12" rx="8" ry="6"/>',
  line:'<path d="M5 19L19 5"/>', text:'<path d="M5 5h14"/><path d="M12 5v14"/>',
  step:'<circle cx="12" cy="12" r="9"/><path d="M11 8h1v8" stroke-width="1.6"/>',
  highlight:'<path d="M4 20h16"/><path d="M6 16l8-11 4 3-8 11z"/>',
  blur:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
};
const TOOLS=['select','arrow','box','ellipse','line','text','step','highlight','blur'];
const tb=$('toolbar');
TOOLS.forEach(t=>{ const b=document.createElement('button'); b.className='tool-btn'+(t===state.tool?' on':''); b.dataset.tool=t; b.title=t;
  b.innerHTML=`<svg viewBox="0 0 24 24">${ICONS[t]}</svg>`; b.onclick=()=>setTool(t); tb.appendChild(b); if(t==='select') tb.appendChild(sep()); });
tb.appendChild(sep());
const mini=document.createElement('div'); mini.className='swatch-mini'; mini.title='Color'; mini.onclick=()=>$('markColor').click(); tb.appendChild(mini);
function sep(){ const s=document.createElement('div'); s.className='tb-sep'; return s; }
function syncMini(){ mini.style.background=state.color; }
function setTool(t){ state.tool=t; selected=null; [...tb.querySelectorAll('.tool-btn')].forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('markGroup').style.display=(t==='select'||t==='blur')?'none':(t==='step'?'block':'block'); if(t==='select')$('markGroup').style.display='none';
  c.classList.toggle('tool',t!=='select'); render(); }

/* ---------- geometry ---------- */
const norm=a=>({x1:Math.min(a.x1,a.x2),y1:Math.min(a.y1,a.y2),x2:Math.max(a.x1,a.x2),y2:Math.max(a.y1,a.y2)});
function barH(){ return state.frame==='none'||!img ? 0 : Math.max(26, Math.round(img.width*0.028)); }
function toImage(e){ const r=c.getBoundingClientRect(), sx=c.width/r.width, sy=c.height/r.height;

/* ---------- rendering ---------- */
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawFrameChrome(pad,bar){
  const W=img.width;

  else { ctx.strokeStyle='#8a8a8a'; ctx.lineWidth=Math.max(1,bar*0.045); const s=bar*0.16;
    [0,1,2].forEach(i=>{ const gx=pad+W-bar*(1.7-i*0.55); ctx.beginPath();
      if(i===0){ ctx.moveTo(gx-s,cy); ctx.lineTo(gx+s,cy); }
      else if(i===1){ ctx.strokeRect(gx-s,cy-s,s*2,s*2); }
      else { ctx.moveTo(gx-s,cy-s); ctx.lineTo(gx+s,cy+s); ctx.moveTo(gx+s,cy-s); ctx.lineTo(gx-s,cy+s); }
      ctx.stroke(); }); }
}
function drawAnnot(a,pad,bar){
  const oy=pad+bar; const n=norm(a), x1=pad+a.x1, y1=oy+a.y1, x2=pad+a.x2, y2=oy+a.y2;
  ctx.strokeStyle=a.color; ctx.fillStyle=a.color; ctx.lineWidth=a.width; ctx.lineCap='round'; ctx.lineJoin='round';
  if(a.type==='blur'){ ctx.save(); roundRect(pad+n.x1,oy+n.y1,n.x2-n.x1,n.y2-n.y1,4); ctx.clip();
    ctx.filter=`blur(${Math.max(5,a.width*2)}px)`; ctx.drawImage(img,pad,oy); ctx.filter='none'; ctx.restore(); return; }
  if(a.type==='box'){ const R=Math.round; ctx.strokeRect(R(pad+n.x1),R(oy+n.y1),R(n.x2-n.x1),R(n.y2-n.y1)); return; }
  if(a.type==='ellipse'){ ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,7); ctx.stroke(); return; }

  if(a.type==='line'){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); return; }
  if(a.type==='arrow'){ const ang=Math.atan2(y2-y1,x2-x1), h=Math.max(12,a.width*3.4), bx=x2-Math.cos(ang)*h*0.9, by=y2-Math.sin(ang)*h*0.9;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-h*Math.cos(ang-0.42),y2-h*Math.sin(ang-0.42)); ctx.lineTo(x2-h*Math.cos(ang+0.42),y2-h*Math.sin(ang+0.42)); ctx.closePath(); ctx.fill(); return; }
  if(a.type==='text'){ const fs=Math.max(14,a.width*5); ctx.font=`600 ${fs}px ${getComputedStyle(document.body).fontFamily}`; ctx.textBaseline='top'; ctx.fillStyle=a.color; ctx.fillText(a.text||'',x1,y1); return; }
  if(a.type==='step'){ const rad=Math.max(13,a.width*3.2); ctx.beginPath(); ctx.arc(x1,y1,rad,0,7); ctx.fillStyle=a.color; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`700 ${rad*1.05}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(a.n),x1,y1+1); ctx.textAlign='left'; return; }
}
function render(){
  if(!img){ stage.classList.add('empty'); return; }
  stage.classList.remove('empty');
  // renumber steps
  let sc=0; annots.forEach(a=>{ if(a.type==='step'){ sc++; a.n=sc; } });
  const pad=state.pad, bar=barH(), W=img.width+pad*2, H=img.height+bar+pad*2, r=state.rad;
  c.width=W; c.height=H; ctx.clearRect(0,0,W,H); paintBg(W,H);
  if(state.shadow>0){ ctx.save(); ctx.shadowColor=`rgba(0,0,0,${0.5*state.shadow/100})`; ctx.shadowBlur=state.shadow*1.1; ctx.shadowOffsetY=state.shadow*0.35;
    ctx.fillStyle='#000'; roundRect(pad,pad,img.width,img.height+bar,r); ctx.fill(); ctx.restore(); }
  ctx.save(); roundRect(pad,pad,img.width,img.height+bar,r); ctx.clip();
  if(bar>0) drawFrameChrome(pad,bar);
  ctx.drawImage(img,pad,pad+bar);
  (current?annots.concat(current):annots).forEach(a=>drawAnnot(a,pad,bar)); drawGuides(pad,bar); drawSpacing(pad,bar); ctx.restore();
  if(selected){ const n=norm(selected), oy=pad+bar; ctx.save(); ctx.strokeStyle='#0a84ff'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
    if(selected.type==='step'){ const rad=Math.max(13,selected.width*3.2); ctx.strokeRect(pad+selected.x1-rad-4,oy+selected.y1-rad-4,rad*2+8,rad*2+8); }
    else ctx.strokeRect(pad+n.x1-4,oy+n.y1-4,(n.x2-n.x1)+8,(n.y2-n.y1)+8);
    ctx.setLineDash([]); const hsz=Math.max(6,8*sPx());
    handlesFor(selected).forEach(h=>{ ctx.fillStyle='#fff'; ctx.strokeStyle='#0a84ff'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.rect(pad+h.x-hsz/2, oy+h.y-hsz/2, hsz, hsz); ctx.fill(); ctx.stroke(); });
    ctx.restore(); }

}
function baseFit(){ const w=Math.max(120,stage.clientWidth-80), h=Math.max(120,stage.clientHeight-102); return Math.min(w/c.width,h/c.height,1); }
function applyDisplay(){ if(!img)return; const s=baseFit()*zoom;
  c.style.width=(c.width*s)+'px'; c.style.height=(c.height*s)+'px';
  // clamp pan so the canvas can't be dragged fully off-stage
  const dw=c.width*s, dh=c.height*s, mx=Math.max(0,(dw-(stage.clientWidth-40))/2)+40, my=Math.max(0,(dh-(stage.clientHeight-40))/2)+40;
  panX=Math.max(-mx,Math.min(mx,panX)); panY=Math.max(-my,Math.min(my,panY));
  document.querySelector('.canvas-wrap').style.transform=`translate(${panX}px,${panY}px)`;
  const z=$('zoomVal'); if(z) z.textContent=Math.round(baseFit()*zoom*100)+'%';
}
function setZoom(z,cx,cy){ zoom=Math.max(0.2,Math.min(5,z)); applyDisplay(); }
function resetZoom(){ zoom=1; panX=0; panY=0; applyDisplay(); }
window.addEventListener('resize', applyDisplay);

/* ---------- undo/redo ---------- */
function snap(){ return JSON.parse(JSON.stringify(annots)); }
function pushUndo(){ undoStack.push(snap()); if(undoStack.length>60)undoStack.shift(); redoStack=[]; }
function undo(){ if(!undoStack.length)return; redoStack.push(snap()); annots=undoStack.pop(); selected=null; render(); }
function redo(){ if(!redoStack.length)return; undoStack.push(snap()); annots=redoStack.pop(); selected=null; render(); }

/* ---------- interaction ---------- */
function hit(a,x,y){ if(a.type==='step'){ const rad=Math.max(13,a.width*3.2); return Math.hypot(x-a.x1,y-a.y1)<=rad+4; }
  const n=norm(a), m=8+a.width; if(a.type==='arrow'||a.type==='line') return distSeg(x,y,a.x1,a.y1,a.x2,a.y2)<m;
  return x>=n.x1-m&&x<=n.x2+m&&y>=n.y1-m&&y<=n.y2+m; }
function distSeg(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1; let t=((px-x1)*dx+(py-y1)*dy)/l; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }

/* ---------- smart snapping ---------- */
function bboxFor(a){
  if(a.type==='step'){ const rd=Math.max(13,a.width*3.2); return {l:a.x1-rd,t:a.y1-rd,r:a.x1+rd,b:a.y1+rd,cx:a.x1,cy:a.y1}; }
  if(a.type==='text'){ const fs=Math.max(14,a.width*5); ctx.font=`600 ${fs}px ${getComputedStyle(document.body).fontFamily}`; const w=ctx.measureText(a.text||'').width||10, h=fs*1.1; return {l:a.x1,t:a.y1,r:a.x1+w,b:a.y1+h,cx:a.x1+w/2,cy:a.y1+h/2}; }
  const n=norm(a); return {l:n.x1,t:n.y1,r:n.x2,b:n.y2,cx:(n.x1+n.x2)/2,cy:(n.y1+n.y2)/2};
}
function moveTo(a,orig,dx,dy){ a.x1=orig.x1+dx; a.y1=orig.y1+dy; a.x2=orig.x2+dx; a.y2=orig.y2+dy; }
function snapDrag(bb,self){
  const th=8*(c.width/Math.max(1,c.clientWidth||c.width));
  const xs=[img.width/2,0,img.width], ys=[img.height/2,0,img.height];
  annots.forEach(a=>{ if(a===self)return; const o=bboxFor(a); xs.push(o.cx,o.l,o.r); ys.push(o.cy,o.t,o.b); });
  let sdx=0,gv=null,best=th; [bb.cx,bb.l,bb.r].forEach(v=>xs.forEach(tp=>{ const d=tp-v; if(Math.abs(d)<best){best=Math.abs(d);sdx=d;gv=tp;} }));
  let sdy=0,gh=null; best=th; [bb.cy,bb.t,bb.b].forEach(v=>ys.forEach(tp=>{ const d=tp-v; if(Math.abs(d)<best){best=Math.abs(d);sdy=d;gh=tp;} }));
  const g=[]; if(gv!=null)g.push({axis:'x',pos:gv}); if(gh!=null)g.push({axis:'y',pos:gh});
  return {sdx,sdy,guides:g};
}
function drawGuides(pad,bar){ if(!guides.length)return; const oy=pad+bar; ctx.save(); ctx.strokeStyle='#ff375f';
  ctx.lineWidth=c.width/Math.max(1,c.clientWidth||c.width); ctx.setLineDash([]);
  guides.forEach(g=>{ ctx.beginPath(); if(g.axis==='x'){ ctx.moveTo(pad+g.pos,oy); ctx.lineTo(pad+g.pos,oy+img.height); } else { ctx.moveTo(pad,oy+g.pos); ctx.lineTo(pad+img.width,oy+g.pos); } ctx.stroke(); }); ctx.restore(); }
const sPx=()=>c.width/Math.max(1,c.clientWidth||c.width);  // image px per 1 screen px (scale-aware)

/* ---------- even-spacing detection (Figma-style equal gaps) ---------- */
function spacingSnap(bb,self){
  const th=11*sPx(); let sdx=0,sdy=0; const marks=[];
  const others=annots.filter(a=>a!==self).map(bboxFor);
  const L=others.filter(o=>o.r<=bb.cx).sort((a,b)=>b.r-a.r)[0], R=others.filter(o=>o.l>=bb.cx).sort((a,b)=>a.l-b.l)[0];
  if(L&&R){ const target=(L.r+R.l)/2, d=target-bb.cx;   // equal gaps left/right (width cancels)
    if(Math.abs(d)<th){ sdx=d; const y=(Math.max(L.t,bb.t,R.t)+Math.min(L.b,bb.b,R.b))/2;
      marks.push({axis:'x',y,x1:L.r,x2:bb.l+d},{axis:'x',y,x1:bb.r+d,x2:R.l}); } }
  const T=others.filter(o=>o.b<=bb.cy).sort((a,b)=>b.b-a.b)[0], D=others.filter(o=>o.t>=bb.cy).sort((a,b)=>a.t-b.t)[0];
  if(T&&D){ const target=(T.b+D.t)/2, d=target-bb.cy;
    if(Math.abs(d)<th){ sdy=d; const x=(Math.max(T.l,bb.l,D.l)+Math.min(T.r,bb.r,D.r))/2;
      marks.push({axis:'y',x,y1:T.b,y2:bb.t+d},{axis:'y',x,y1:bb.b+d,y2:D.t}); } }
  return {sdx,sdy,marks};
}
function drawSpacing(pad,bar){ if(!spacingMarks.length)return; const oy=pad+bar, u=sPx(), tick=6*u, gap=2.5*u;
  ctx.save(); ctx.strokeStyle='#ff375f'; ctx.lineWidth=Math.max(1.4,2*u); ctx.lineCap='butt';
  spacingMarks.forEach(m=>{ ctx.beginPath();
    if(m.axis==='x'){ const y=oy+m.y, a=pad+m.x1, b=pad+m.x2, mid=(a+b)/2;
      ctx.moveTo(a,y);ctx.lineTo(b,y);                                   // connector
      ctx.moveTo(a,y-tick);ctx.lineTo(a,y+tick); ctx.moveTo(b,y-tick);ctx.lineTo(b,y+tick); // end caps
      ctx.moveTo(mid-gap,y-tick);ctx.lineTo(mid-gap,y+tick); ctx.moveTo(mid+gap,y-tick);ctx.lineTo(mid+gap,y+tick); } // "=" equal marks
    else { const x=pad+m.x, a=oy+m.y1, b=oy+m.y2, mid=(a+b)/2;
      ctx.moveTo(x,a);ctx.lineTo(x,b);
      ctx.moveTo(x-tick,a);ctx.lineTo(x+tick,a); ctx.moveTo(x-tick,b);ctx.lineTo(x+tick,b);
      ctx.moveTo(x-tick,mid-gap);ctx.lineTo(x+tick,mid-gap); ctx.moveTo(x-tick,mid+gap);ctx.lineTo(x+tick,mid+gap); }
    ctx.stroke(); }); ctx.restore(); }

/* ---------- resize handles ---------- */
function handlesFor(a){
  if(a.type==='arrow'||a.type==='line') return [{id:'p1',x:a.x1,y:a.y1},{id:'p2',x:a.x2,y:a.y2}];
  if(a.type==='step'||a.type==='text') return [];
  const n=norm(a), xs=[n.x1,(n.x1+n.x2)/2,n.x2], ys=[n.y1,(n.y1+n.y2)/2,n.y2];
  const ids=[['nw','n','ne'],['w',null,'e'],['sw','s','se']], out=[];
  for(let r=0;r<3;r++)for(let col=0;col<3;col++){ const id=ids[r][col]; if(id) out.push({id,x:xs[col],y:ys[r]}); }
  return out;
}
function resizeAnnot(a,id,px,py){
  px=Math.round(px); py=Math.round(py); // integer image coords -> both edges land the same, no thickness shimmer
  if(id==='p1'){ a.x1=px; a.y1=py; return; } if(id==='p2'){ a.x2=px; a.y2=py; return; }
  if(id.includes('w')) a.x1=px; if(id.includes('e')) a.x2=px;
  if(id.includes('n')) a.y1=py; if(id.includes('s')) a.y2=py;
}
function pointSnap(px,py,self){ const th=8*sPx(); const xs=[img.width/2,0,img.width], ys=[img.height/2,0,img.height];
  annots.forEach(a=>{ if(a===self)return; const o=bboxFor(a); xs.push(o.cx,o.l,o.r); ys.push(o.cy,o.t,o.b); });
  let gx=null,bx=th; xs.forEach(t=>{ const d=Math.abs(t-px); if(d<bx){bx=d;px=t;gx=t;} });
  let gy=null,by=th; ys.forEach(t=>{ const d=Math.abs(t-py); if(d<by){by=d;py=t;gy=t;} });
  const g=[]; if(gx!=null)g.push({axis:'x',pos:gx}); if(gy!=null)g.push({axis:'y',pos:gy});
  return {x:px,y:py,guides:g};
}
function hitHandle(a,x,y){ const tol=9*sPx(); return handlesFor(a).find(h=>Math.abs(h.x-x)<tol&&Math.abs(h.y-y)<tol)||null; }

c.addEventListener('mousedown', e=>{
  if(!img)return; const p=toImage(e);
  if(panMode||e.button===1){ dragMode='pan'; panStart={x:e.clientX,y:e.clientY,px:panX,py:panY}; e.preventDefault(); return; }
  if(state.tool==='select'){
    // grab a resize handle of the already-selected shape first
    if(selected){ const h=hitHandle(selected,p.x,p.y);
      if(h){ pushUndo(); if(selected.type!=='arrow'&&selected.type!=='line'){ const n=norm(selected); selected.x1=n.x1;selected.y1=n.y1;selected.x2=n.x2;selected.y2=n.y2; }
        dragMode='resize'; resizeH=h.id; render(); return; } }
    selected=[...annots].reverse().find(a=>hit(a,p.x,p.y))||null;
    if(selected){ pushUndo(); dragMode='move'; dragStart={x:p.x,y:p.y}; dragOrig={x1:selected.x1,y1:selected.y1,x2:selected.x2,y2:selected.y2}; if(selected.color)$('markColor').value=selected.color; }
    else { dragMode='pan'; panStart={x:e.clientX,y:e.clientY,px:panX,py:panY}; }  // drag empty area to pan
    render(); return; }
  if(state.tool==='text'){ placeText(e,p); return; }
  if(state.tool==='step'){ pushUndo(); annots.push({type:'step',x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:state.color,width:state.width,n:0}); render(); return; }
  current={type:state.tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:state.color,width:state.width}; render();
});
window.addEventListener('mousemove', e=>{
  if(dragMode==='pan'&&panStart){ panX=panStart.px+(e.clientX-panStart.x); panY=panStart.py+(e.clientY-panStart.y); applyDisplay(); return; }
  if(current){ const p=toImage(e); current.x2=p.x; current.y2=p.y; render(); }
  else if(dragMode==='resize'&&selected){ const p=toImage(e), s=pointSnap(p.x,p.y,selected);
    resizeAnnot(selected,resizeH,s.x,s.y); guides=s.guides; render(); }
  else if(dragMode==='move'&&selected){ const p=toImage(e), rdx=p.x-dragStart.x, rdy=p.y-dragStart.y;
    const bb=bboxFor(Object.assign({},selected,{x1:dragOrig.x1+rdx,y1:dragOrig.y1+rdy,x2:dragOrig.x2+rdx,y2:dragOrig.y2+rdy}));
    const al=snapDrag(bb,selected), sp=spacingSnap(bb,selected);
    let dx=rdx,dy=rdy,g=[],marks=[];
    if(sp.sdx){ dx+=sp.sdx; marks=marks.concat(sp.marks.filter(m=>m.axis==='x')); } else { dx+=al.sdx; const gg=al.guides.find(x=>x.axis==='x'); if(gg)g.push(gg); }
    if(sp.sdy){ dy+=sp.sdy; marks=marks.concat(sp.marks.filter(m=>m.axis==='y')); } else { dy+=al.sdy; const gg=al.guides.find(x=>x.axis==='y'); if(gg)g.push(gg); }
    moveTo(selected,dragOrig,dx,dy); guides=g; spacingMarks=marks; render(); }
});
window.addEventListener('mouseup', ()=>{
  if(current){ const n=norm(current); if((n.x2-n.x1)>3||(n.y2-n.y1)>3){ pushUndo(); annots.push(current); } current=null; render(); }
  if(guides.length||spacingMarks.length){ guides=[]; spacingMarks=[]; render(); }
  dragMode=null; panStart=null; resizeH=null;
});
// zoom: Ctrl/Cmd + wheel (pinch on trackpad), centered
stage.addEventListener('wheel', e=>{ if(!img)return; if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.12:0.89)); } }, {passive:false});
// hold Space to pan
window.addEventListener('keydown', e=>{ if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){ panMode=true; c.style.cursor='grab'; } });
window.addEventListener('keyup', e=>{ if(e.code==='Space'){ panMode=false; c.style.cursor=''; } });
$('zoomIn').onclick=()=>setZoom(zoom*1.15); $('zoomOut').onclick=()=>setZoom(zoom*0.87); $('zoomFit').onclick=()=>resetZoom();
window.addEventListener('keydown', e=>{
  if((e.key==='Delete'||e.key==='Backspace')&&selected){ pushUndo(); annots=annots.filter(a=>a!==selected); selected=null; render(); e.preventDefault(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.shiftKey?redo():undo(); e.preventDefault(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){ redo(); e.preventDefault(); }
});
function placeText(e,p){ const ti=$('textInput'), r=c.getBoundingClientRect();
  ti.style.display='block'; ti.style.left=e.clientX+'px'; ti.style.top=e.clientY+'px'; ti.style.color=state.color;
  ti.style.fontSize=Math.max(14,state.width*5)*(r.width/c.width)+'px'; ti.value=''; setTimeout(()=>ti.focus(),0);
  const commit=()=>{ if(ti.value.trim()){ pushUndo(); annots.push({type:'text',x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:state.color,width:state.width,text:ti.value}); }
    ti.style.display='none'; ti.onblur=null; ti.onkeydown=null; render(); };
  ti.onblur=commit; ti.onkeydown=ev=>{ if(ev.key==='Enter'){ev.preventDefault();commit();} if(ev.key==='Escape'){ti.style.display='none';ti.onblur=null;} };
}

/* ---------- settings popover ---------- */
$('gearBtn').onclick=()=>$('settings').classList.toggle('open');
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#settings')&&!e.target.closest('#gearBtn')) $('settings').classList.remove('open'); });
function syncSettingsUI(){ $('autoCopy').classList.toggle('on',settings.autoCopy); $('hotkeySel').value=settings.hotkey;
  $('folderPath').textContent=settings.saveFolder||'Ask every time'; }
$('autoCopy').onclick=()=>{ settings.autoCopy=!settings.autoCopy; syncSettingsUI(); saveSettings(); if(HOST)HOST.postMessage({type:'setAutoCopy',value:settings.autoCopy}); };
$('hotkeySel').onchange=e=>{ settings.hotkey=e.target.value; if(HOST)HOST.postMessage({type:'setHotkey',value:settings.hotkey}); };
$('chooseFolder').onclick=()=>{ if(HOST)HOST.postMessage({type:'chooseSaveFolder'}); };

/* ---------- image in/out + bridge ---------- */
const HOST=window.chrome&&window.chrome.webview;
function setImage(src){ const i=new Image(); i.onload=()=>{ img=i; annots=[]; selected=null; undoStack=[]; redoStack=[]; zoom=1; panX=0; panY=0; render();
  if(HOST&&settings.autoCopy) HOST.postMessage({type:'copy',data:exportPng()}); }; i.src=src; }
window.supershot={ setImage };
function loadFromFile(f){ if(!f)return; const rd=new FileReader(); rd.onload=e=>setImage(e.target.result); rd.readAsDataURL(f); }
$('file').onchange=e=>loadFromFile(e.target.files[0]);
document.addEventListener('paste',e=>{ const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/')); if(it)loadFromFile(it.getAsFile()); });
['dragover','drop'].forEach(ev=>stage.addEventListener(ev,e=>e.preventDefault()));
stage.addEventListener('drop',e=>{ const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/')); if(f)loadFromFile(f); });

function exportPng(){ const keep=selected, kg=guides, ks=spacingMarks; selected=null; guides=[]; spacingMarks=[]; render(); const url=c.toDataURL('image/png'); selected=keep; guides=kg; spacingMarks=ks; render(); return url; }
function fileName(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `Supershot ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}.png`; }

if(HOST){
  HOST.addEventListener('message',e=>{ const m=e.data; if(!m)return;
    if(m.type==='image'&&m.data) setImage(m.data);
    else if(m.type==='settings'){ Object.assign(settings,m.value||{}); syncSettingsUI(); } });
  $('titlebar').addEventListener('mousedown',e=>{ if(!e.target.closest('#wc')&&!e.target.closest('#gearBtn')) HOST.postMessage({type:'drag'}); });
  $('wc').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)HOST.postMessage({type:b.dataset.w}); });
  $('openBtn').onclick=()=>HOST.postMessage({type:'open'});
  $('saveBtn').onclick=()=>{ if(img)HOST.postMessage({type:'save',data:exportPng()}); };
  $('copyBtn').onclick=()=>{ if(img)HOST.postMessage({type:'copy',data:exportPng()}); };
  HOST.postMessage({type:'ready'});
} else {
  $('wc').style.display='none'; $('hostOnly').style.display='block';
  $('openBtn').onclick=()=>$('file').click();
  $('saveBtn').onclick=()=>{ const a=document.createElement('a'); a.href=exportPng(); a.download=fileName(); a.click(); };
  $('copyBtn').onclick=async()=>{ try{ const b=await new Promise(r=>c.toBlob(r,'image/png')); await navigator.clipboard.write([new ClipboardItem({'image/png':b})]); }catch(e){} };
}

/* ---------- boot ---------- */
loadSettings();
// apply loaded state to controls
['pad','rad','sh'].forEach((id,i)=>{ const el=$(id), key=['pad','rad','shadow'][i]; el.value=state[key]; fillTrack(el); });
$('padV').textContent=state.pad; $('radV').textContent=state.rad; $('shV').textContent=state.shadow;
$('strokeW').value=state.width; fillTrack($('strokeW')); $('wV').textContent=state.width;
$('solid').value=state.solid; $('markColor').value=state.color;
[...$('frametype').children].forEach(x=>x.classList.toggle('on',x.dataset.f===state.frame));
syncBgType(); syncMini(); syncSettingsUI();

function makeSample(){
  const s=document.createElement('canvas'); s.width=1200; s.height=760; const x=s.getContext('2d');
  x.fillStyle='#0f1218'; x.fillRect(0,0,1200,760);
  x.fillStyle='#171b22'; x.fillRect(0,0,1200,52);
  ['#ff5f57','#febc2e','#28c840'].forEach((col,i)=>{ x.fillStyle=col; x.beginPath(); x.arc(28+i*22,26,7,0,7); x.fill(); });
  x.fillStyle='#8b93a3'; x.font='500 15px sans-serif'; x.fillText('Dashboard — Overview',470,31);
  x.fillStyle='#12151b'; x.fillRect(0,52,240,708);
  x.fillStyle='#0a84ff'; x.fillRect(0,96,4,34); x.fillStyle='#e6e9f0'; x.font='600 14px sans-serif'; x.fillText('Home',30,118);
  ['Projects','Analytics','Team','Settings'].forEach((t,i)=>{ x.fillStyle='#8b93a3'; x.fillText(t,30,168+i*40); });
  const grad=x.createLinearGradient(280,90,1160,90); grad.addColorStop(0,'#0a84ff'); grad.addColorStop(1,'#57e0d0');
  [['Revenue','$48.2k'],['Active','1,204'],['Uptime','99.98%']].forEach((cd,i)=>{ const cx=280+i*300;
    x.fillStyle='#151a22'; rr(x,cx,96,268,120,14); x.fill(); x.fillStyle='#8b93a3'; x.font='500 13px sans-serif'; x.fillText(cd[0],cx+20,128);
    x.fillStyle='#eef1f6'; x.font='700 30px sans-serif'; x.fillText(cd[1],cx+20,168); });
  x.fillStyle='#151a22'; rr(x,280,240,880,470,14); x.fill(); x.strokeStyle=grad; x.lineWidth=3; x.beginPath();
  const pts=[.6,.5,.62,.45,.3,.42,.35,.25,.3,.18,.22,.12]; pts.forEach((p,i)=>{ const px=320+i*(800/(pts.length-1)), py=280+p*420; i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  return s.toDataURL();
}
function rr(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
$('sampleLink').onclick=()=>setImage(makeSample());
if(!HOST) setImage(makeSample());
</script>
</body>
