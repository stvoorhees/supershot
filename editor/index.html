<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supershot</title>
<style>
  /* Supershot editor — offline, self-contained. The native shell (WPF) injects the
     captured PNG via window.supershot.setImage(dataUrl); standalone you can drop/paste. */
  :root{
    --bg:#0a0b0d; --stage:#0c0e11; --panel:#131519; --panel-2:#16191e;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --ink:#eef1f6; --ink-2:#aab2c0; --ink-3:#6b7382;
    --accent:#7c8cff; --accent-2:#57e0d0; --accent-ink:#0a0b0d;
    --radius:12px; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(124,140,255,.28)}

  /* frameless custom title bar (drag region in the app) */
  .titlebar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);
    -webkit-app-region:drag;user-select:none;background:linear-gradient(180deg,#0e1013,#0a0b0d)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;letter-spacing:-.02em}
  .logo{width:18px;height:18px;border-radius:6px;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent));
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 10px rgba(124,140,255,.5)}
  .brand .sub{color:var(--ink-3);font-weight:500}
  .tb-spacer{flex:1}
  .wc{display:flex;gap:4px;-webkit-app-region:no-drag}
  .wc button{width:32px;height:26px;border:0;background:transparent;color:var(--ink-2);border-radius:7px;cursor:pointer;font-size:13px;font-family:var(--sans);transition:.12s}
  .wc button:hover{background:var(--panel-2);color:var(--ink)}
  .wc button[data-w=close]:hover{background:#e5484d;color:#fff}

  .app{height:calc(100% - 44px);display:grid;grid-template-columns:1fr 320px}

  /* ---------- stage ---------- */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(124,140,255,.06), transparent 60%),
      radial-gradient(80% 80% at 50% 120%, rgba(87,224,208,.05), transparent 60%),
      var(--stage);}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:22px 22px}
  .canvas-wrap{position:relative;max-width:calc(100% - 72px);max-height:calc(100% - 72px);display:flex;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
  canvas{max-width:100%;max-height:100%;border-radius:6px;display:block}
  .drop-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    color:var(--ink-2);font-size:14px;pointer-events:none}
  .stage.empty .canvas-wrap{display:none}
  .stage.empty .drop-hint{display:flex}
  .drop-hint .big{font-size:19px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
  .drop-hint kbd{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--ink-2)}

  /* ---------- controls ---------- */
  .panel{border-left:1px solid var(--line);background:linear-gradient(180deg,#101216,#0e1013);overflow-y:auto;padding:6px 0 90px}
  .panel::-webkit-scrollbar{width:9px}.panel::-webkit-scrollbar-thumb{background:#22262e;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  .group{padding:16px 16px 18px;border-bottom:1px solid var(--line)}
  .glabel{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}

  /* segmented control */
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:12.5px;font-weight:500;
    padding:7px 0;border-radius:7px;cursor:pointer;transition:.15s;letter-spacing:-.01em}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 1px 3px rgba(0,0,0,.4)}

  /* swatch grid */
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .sw{aspect-ratio:1;border-radius:9px;cursor:pointer;border:1px solid var(--line);position:relative;transition:transform .12s,box-shadow .15s}
  .sw:hover{transform:translateY(-2px)}
  .sw.on{box-shadow:0 0 0 2px var(--accent),0 0 0 4px rgba(124,140,255,.25)}

  /* sliders */
  .row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .row label{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;min-width:44px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:#20242c;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);
    border:0;cursor:pointer;box-shadow:0 0 0 4px rgba(124,140,255,.001),0 2px 6px rgba(0,0,0,.5);transition:box-shadow .15s}
  input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 6px rgba(124,140,255,.18),0 2px 6px rgba(0,0,0,.5)}

  /* aspect chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-family:var(--sans);font-size:12px;font-weight:500;
    padding:6px 11px;border-radius:999px;cursor:pointer;transition:.14s;letter-spacing:-.01em}
  .chip:hover{color:var(--ink);border-color:var(--line-2)}
  .chip.on{background:var(--ink);color:#0a0b0d;border-color:var(--ink);font-weight:600}

  input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;border:1px solid var(--line);border-radius:9px;cursor:pointer;padding:3px}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}

  /* action bar */
  .actions{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;padding:14px 16px;background:linear-gradient(0deg,#0e1013 70%,transparent);border-top:1px solid var(--line)}
  .btn{flex:1;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:13px;
    padding:11px 0;border-radius:10px;cursor:pointer;transition:.15s;letter-spacing:-.01em}
  .btn:hover{border-color:#3a4150;background:#1b1f26}
  .btn.primary{border:0;color:var(--accent-ink);background:linear-gradient(180deg,#8f9dff,#6f7ff5);box-shadow:0 4px 16px rgba(124,140,255,.4)}
  .btn.primary:hover{filter:brightness(1.06)}
  .hidden-file{display:none}
</style>
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="brand"><span class="logo"></span>Supershot <span class="sub">· editor</span></div>
    <div class="tb-spacer"></div>
    <div class="wc" id="wc">
      <button data-w="min" title="Minimize">&#x2013;</button>
      <button data-w="close" title="Close">&#x2715;</button>
    </div>
  </div>

  <div class="app">
    <div class="stage empty" id="stage">
      <div class="canvas-wrap"><canvas id="c"></canvas></div>
      <div class="drop-hint">
        <div class="big">Drop or paste a screenshot</div>
        <div>or press <kbd>⌘/Ctrl</kbd> + <kbd>V</kbd> · <span id="sampleLink" style="color:var(--accent);cursor:pointer;pointer-events:auto">load a sample</span></div>
      </div>
    </div>

    <aside class="panel">
      <div class="group">
        <div class="glabel">Background</div>
        <div class="seg" id="bgtype">
          <button data-t="gradient" class="on">Gradient</button>
          <button data-t="solid">Solid</button>
          <button data-t="none">None</button>
        </div>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="solid" value="#1f2430" style="display:none;margin-top:12px" />
      </div>

      <div class="group">
        <div class="glabel">Frame</div>
        <div class="row"><label>Padding</label><span class="val" id="padV">64</span></div>
        <input type="range" id="pad" min="0" max="240" value="64" />
        <div class="row"><label>Rounding</label><span class="val" id="radV">14</span></div>
        <input type="range" id="rad" min="0" max="48" value="14" />
        <div class="row"><label>Shadow</label><span class="val" id="shV">45</span></div>
        <input type="range" id="sh" min="0" max="100" value="45" />
      </div>

      <div class="group">
        <div class="glabel">Aspect ratio</div>
        <div class="chips" id="aspect">
          <button data-a="auto" class="on">Auto</button>
          <button data-a="1">1:1</button>
          <button data-a="1.3333">4:3</button>
          <button data-a="1.7778">16:9</button>
          <button data-a="0.8">4:5</button>
          <button data-a="1.91">1.91:1</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="openBtn">Open</button>
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </aside>
  </div>
  <input type="file" id="file" class="hidden-file" accept="image/*" />

<script>
const GRADIENTS = [
  {a:'#f6d365',b:'#fda085',ang:135}, {a:'#a1c4fd',b:'#c2e9fb',ang:135},
  {a:'#7b6cff',b:'#8ee3f5',ang:135}, {a:'#ff9a9e',b:'#fad0c4',ang:135},
  {a:'#30cfd0',b:'#330867',ang:135}, {a:'#0f2027',b:'#2c5364',ang:135},
  {a:'#e0c3fc',b:'#8ec5fc',ang:135}, {a:'#f093fb',b:'#f5576c',ang:135},
  {a:'#4facfe',b:'#00f2fe',ang:135}, {a:'#161a24',b:'#2b2f3a',ang:135},
];
const state = { bgType:'gradient', grad:2, solid:'#1f2430', pad:64, rad:14, shadow:45, aspect:'auto' };
let img = null;

const c = document.getElementById('c'), ctx = c.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

// swatches
const swWrap = $('swatches');
GRADIENTS.forEach((g,i)=>{
  const d = document.createElement('div'); d.className='sw'+(i===state.grad?' on':'');
  d.style.background=`linear-gradient(${g.ang}deg, ${g.a}, ${g.b})`;
  d.onclick=()=>{ state.grad=i; state.bgType='gradient'; syncBgType(); [...swWrap.children].forEach(x=>x.classList.remove('on')); d.classList.add('on'); render(); };
  swWrap.appendChild(d);
});

function syncBgType(){
  [...$('bgtype').children].forEach(b=>b.classList.toggle('on', b.dataset.t===state.bgType));
  swWrap.style.display = state.bgType==='gradient' ? 'grid':'none';
  $('solid').style.display = state.bgType==='solid' ? 'block':'none';
}
$('bgtype').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; state.bgType=b.dataset.t; syncBgType(); render(); });
$('solid').addEventListener('input', e=>{ state.solid=e.target.value; render(); });

// sliders
const bind=(id,key,label)=>{ const el=$(id); el.addEventListener('input',()=>{ state[key]=+el.value; $(label).textContent=el.value; render(); }); };
bind('pad','pad','padV'); bind('rad','rad','radV'); bind('sh','shadow','shV');

// aspect
$('aspect').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return;
  state.aspect=b.dataset.a; [...$('aspect').children].forEach(x=>x.classList.toggle('on',x===b)); render(); });

// ---------- rendering ----------
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function paintBg(w,h){
  if(state.bgType==='none') return; // transparent
  if(state.bgType==='solid'){ ctx.fillStyle=state.solid; ctx.fillRect(0,0,w,h); return; }
  const g=GRADIENTS[state.grad]; const rad=(g.ang-90)*Math.PI/180;
  const cx=w/2, cy=h/2, len=Math.max(w,h);
  const gr=ctx.createLinearGradient(cx-Math.cos(rad)*len/2, cy-Math.sin(rad)*len/2, cx+Math.cos(rad)*len/2, cy+Math.sin(rad)*len/2);
  gr.addColorStop(0,g.a); gr.addColorStop(1,g.b); ctx.fillStyle=gr; ctx.fillRect(0,0,w,h);
}

function render(){
  if(!img){ stage.classList.add('empty'); return; }
  stage.classList.remove('empty');
  const pad=state.pad;
  let W = img.width + pad*2, H = img.height + pad*2;
  if(state.aspect!=='auto'){ const ar=+state.aspect;
    // grow the smaller dimension so the image + padding fit the target aspect
    if(W/H < ar) W = Math.round(H*ar); else H = Math.round(W/ar);
  }
  c.width=W; c.height=H;
  ctx.clearRect(0,0,W,H);
  paintBg(W,H);
  const ix=Math.round((W-img.width)/2), iy=Math.round((H-img.height)/2), r=state.rad;
  // shadow cast by a rounded plate behind the image
  if(state.shadow>0){ ctx.save(); ctx.shadowColor=`rgba(0,0,0,${0.5*state.shadow/100})`;
    ctx.shadowBlur=state.shadow*1.1; ctx.shadowOffsetY=state.shadow*0.35;
    ctx.fillStyle='#000'; roundRect(ix,iy,img.width,img.height,r); ctx.fill(); ctx.restore(); }
  // image clipped to rounded rect
  ctx.save(); roundRect(ix,iy,img.width,img.height,r); ctx.clip(); ctx.drawImage(img,ix,iy); ctx.restore();
}

// ---------- image in/out ----------
const HOST = window.chrome && window.chrome.webview;   // present only inside the WPF WebView2 shell
function setImage(src){ const i=new Image(); i.onload=()=>{ img=i; render(); }; i.src=src; }
window.supershot = { setImage }; // native shell bridge

function loadFromFile(f){ if(!f)return; const rd=new FileReader(); rd.onload=e=>setImage(e.target.result); rd.readAsDataURL(f); }
$('file').addEventListener('change', e=>loadFromFile(e.target.files[0]));

document.addEventListener('paste', e=>{ const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/')); if(it) loadFromFile(it.getAsFile()); });
['dragover','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();}));
stage.addEventListener('drop', e=>{ const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/')); if(f) loadFromFile(f); });

const pngDataUrl = ()=>c.toDataURL('image/png');

if(HOST){
  // native shell: host supplies the capture and handles save/copy/open natively
  HOST.addEventListener('message', e=>{ const m=e.data; if(m && m.type==='image' && m.data) setImage(m.data); });
  $('openBtn').onclick =()=>HOST.postMessage({type:'open'});
  $('saveBtn').onclick =()=>{ if(img) HOST.postMessage({type:'save', data:pngDataUrl()}); };
  $('copyBtn').onclick =()=>{ if(img) HOST.postMessage({type:'copy', data:pngDataUrl()}); };
  // frameless window controls: drag from the title bar, minimize/close via the host
  $('titlebar').addEventListener('mousedown', e=>{ if(!e.target.closest('#wc')) HOST.postMessage({type:'drag'}); });
  $('wc').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) HOST.postMessage({type:b.dataset.w}); });
  HOST.postMessage({type:'ready'});   // tell the shell we're ready for the captured image
} else {
  $('wc').style.display='none';       // no custom window controls in a browser tab
  // standalone browser: file dialog, clipboard, download
  $('openBtn').onclick=()=>$('file').click();
  $('saveBtn').onclick=async()=>{ const a=document.createElement('a'); a.href=pngDataUrl(); a.download='supershot.png'; a.click(); };
  $('copyBtn').onclick=async()=>{ try{ const b=await new Promise(r=>c.toBlob(r,'image/png')); await navigator.clipboard.write([new ClipboardItem({'image/png':b})]); }catch(e){} };
}

// ---------- built-in sample (so the empty state can preview) ----------
function makeSample(){
  const s=document.createElement('canvas'); s.width=1200; s.height=760; const x=s.getContext('2d');
  x.fillStyle='#0f1218'; x.fillRect(0,0,1200,760);
  // window chrome
  x.fillStyle='#171b22'; x.fillRect(0,0,1200,52);
  ['#ff5f57','#febc2e','#28c840'].forEach((col,i)=>{ x.fillStyle=col; x.beginPath(); x.arc(28+i*22,26,7,0,7); x.fill(); });
  x.fillStyle='#8b93a3'; x.font='500 15px -apple-system,Segoe UI,sans-serif'; x.fillText('Dashboard — Overview', 470, 31);
  // sidebar
  x.fillStyle='#12151b'; x.fillRect(0,52,240,708);
  x.fillStyle='#7c8cff'; x.fillRect(0,96,4,34); x.fillStyle='#e6e9f0'; x.font='600 14px -apple-system,Segoe UI,sans-serif'; x.fillText('Home',30,118);
  ['Projects','Analytics','Team','Settings'].forEach((t,i)=>{ x.fillStyle='#8b93a3'; x.fillText(t,30,168+i*40); });
  // cards
  const grad=x.createLinearGradient(280,90,1160,90); grad.addColorStop(0,'#7c8cff'); grad.addColorStop(1,'#57e0d0');
  [['Revenue','$48.2k'],['Active','1,204'],['Uptime','99.98%']].forEach((cd,i)=>{ const cx=280+i*300;
    x.fillStyle='#151a22'; x.strokeStyle='rgba(255,255,255,.06)'; roundRectX(x,cx,96,268,120,14); x.fill(); x.stroke();
    x.fillStyle='#8b93a3'; x.font='500 13px -apple-system,Segoe UI,sans-serif'; x.fillText(cd[0],cx+20,128);
    x.fillStyle='#eef1f6'; x.font='700 30px -apple-system,Segoe UI,sans-serif'; x.fillText(cd[1],cx+20,168); });
  // chart
  x.fillStyle='#151a22'; roundRectX(x,280,240,880,470,14); x.fill();
  x.strokeStyle=grad; x.lineWidth=3; x.beginPath();
  const pts=[0.6,0.5,0.62,0.45,0.3,0.42,0.35,0.25,0.3,0.18,0.22,0.12];
  pts.forEach((p,i)=>{ const px=320+i*(800/(pts.length-1)), py=280+p*420; i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  return s.toDataURL();
}
function roundRectX(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
$('sampleLink').onclick=()=>setImage(makeSample());

// standalone only: auto-load the sample so the editor is never a blank slate.
// In the shell, the host sends the real capture after it receives our 'ready'.
if(!HOST) setImage(makeSample());
</script>
</body>
</html>
